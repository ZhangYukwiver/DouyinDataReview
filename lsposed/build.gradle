plugins {
    id 'com.android.application' version '9.2.0'
}

def profilePath = providers.gradleProperty('bundledFeedProfile')
android {
    namespace 'app.douyinreview.feed'
    compileSdk 37
    defaultConfig {
        applicationId 'app.douyinreview.feed'
        minSdk 28
        targetSdk 36
        versionCode 3
        versionName '0.2.0'
        buildConfigField 'boolean', 'BUNDLED_PROFILE', profilePath.isPresent().toString()
    }
    buildFeatures { buildConfig = true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    packaging.resources.merges += 'META-INF/xposed/*'
}

abstract class FeedProfileAssets extends DefaultTask {
    @InputFile @PathSensitive(PathSensitivity.NONE) abstract RegularFileProperty getProfile()
    @OutputDirectory abstract DirectoryProperty getOutputDir()

    @TaskAction void generate() {
        def destination = outputDir.file('review-feed.json').get().asFile
        destination.parentFile.mkdirs()
        destination.bytes = profile.get().asFile.bytes
    }
}

// 只有制作用户自己的单包时才传入配置，常规模块构建不包含个人词条。
if (profilePath.isPresent()) {
    def profile = file(profilePath.get())
    if (!profile.isFile() || profile.length() > 4 * 1024 * 1024) {
        throw new GradleException('内置推荐流配置不存在或超过 4 MB。')
    }
    androidComponents.onVariants(androidComponents.selector().all()) { variant ->
        def prepare = tasks.register("prepare${variant.name.capitalize()}FeedProfile", FeedProfileAssets) {
            it.profile.set(profile)
        }
        variant.sources.assets.addGeneratedSourceDirectory(prepare) { it.outputDir }
    }
}

dependencies {
    compileOnly 'io.github.libxposed:api:102.0.0'
    implementation 'io.github.libxposed:service:102.0.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20250517'
}
