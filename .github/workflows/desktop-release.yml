name: Desktop build and release

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-latest
          - platform: macos-arm64
            runner: macos-15
          - platform: linux-x64
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    env:
      CI: 'true'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          # 设置「关于」的近 5 版更新要从发版标签里取旧的 release-notes.md
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Install Electron
        if: runner.os != 'macOS'
        run: node node_modules/electron/install.js
      - name: Install Windows media build dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (!(Test-Path 'C:\msys64\usr\bin\bash.exe')) {
            choco install msys2 --yes --no-progress
          }
          & 'C:\msys64\usr\bin\bash.exe' -lc 'pacman -Sy --needed --noconfirm mingw-w64-x86_64-gcc mingw-w64-x86_64-pkgconf make diffutils nasm'
      - name: Check tag version
        if: startsWith(github.ref, 'refs/tags/')
        run: >-
          node --input-type=module -e
          'import fs from "node:fs"; const { version } = JSON.parse(fs.readFileSync("package.json", "utf8"));
          if (process.env.GITHUB_REF_NAME !== `v${version}`) throw new Error("Tag must equal v + package.json version");'
      - run: npm run check:geo
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:web
      - run: npm run direct:setup
      - name: Build redistributable Windows media tools
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MEDIA_TARGET_PLATFORM: win32
          MEDIA_TARGET_ARCH: x64
          MEDIA_TOOLS_SOURCE_DIR: ${{ runner.temp }}\media-tools
          MSYSTEM: MINGW64
        run: |
          & 'C:\msys64\usr\bin\bash.exe' -lc 'export PATH=/mingw64/bin:$PATH; cd "$(cygpath -u "$GITHUB_WORKSPACE")" && bash scripts/build-media-tools.sh'
      - name: Build redistributable Apple media tools
        if: runner.os == 'macOS'
        env:
          MEDIA_TARGET_PLATFORM: darwin
          MEDIA_TARGET_ARCH: arm64
          MEDIA_TOOLS_SOURCE_DIR: ${{ runner.temp }}/media-tools
        run: bash scripts/build-media-tools.sh
      - name: Build redistributable Linux media tools
        if: runner.os == 'Linux'
        env:
          MEDIA_TARGET_PLATFORM: linux
          MEDIA_TARGET_ARCH: x64
          MEDIA_TOOLS_SOURCE_DIR: ${{ runner.temp }}/media-tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends nasm
          bash scripts/build-media-tools.sh
      - name: Stage redistributable media tools
        env:
          MEDIA_TOOLS_SOURCE_DIR: ${{ runner.temp }}/media-tools
        run: npm run stage:media-tools
      - name: Install Apple Silicon Electron
        if: runner.os == 'macOS'
        env:
          ELECTRON_INSTALL_ARCH: arm64
        run: |
          # electronDist uses the locally installed Electron. install.js otherwise
          # accepts an existing x64 binary without checking its architecture.
          node --input-type=module -e 'import fs from "node:fs"; import path from "node:path"; import { createRequire } from "node:module"; const require = createRequire(import.meta.url); const root = path.dirname(require.resolve("electron/package.json")); fs.rmSync(path.join(root, "dist"), { recursive: true, force: true });'
          node node_modules/electron/install.js
          test "$(lipo -archs node_modules/electron/dist/Electron.app/Contents/MacOS/Electron)" = arm64
      - name: Package Windows installer
        if: runner.os == 'Windows'
        run: npx electron-builder --win nsis --x64 --publish never
      - name: Package Apple Silicon installers
        if: runner.os == 'macOS'
        run: npx electron-builder --mac --arm64 --publish never
      - name: Package Linux installers
        if: runner.os == 'Linux'
        run: npx electron-builder --linux --x64 --publish never
      - name: Verify Windows package
        if: runner.os == 'Windows'
        run: node scripts/verify-release-package.mjs release/win-unpacked/resources
      - name: Verify Apple Silicon package
        if: runner.os == 'macOS'
        run: |
          node scripts/verify-release-package.mjs 'release/mac-arm64/DouyinDataReview.app/Contents/Resources'
          test "$(lipo -archs 'release/mac-arm64/DouyinDataReview.app/Contents/MacOS/DouyinDataReview')" = arm64
      - name: Verify Linux package
        if: runner.os == 'Linux'
        run: |
          node scripts/verify-release-package.mjs release/linux-unpacked/resources
          # 媒体工具要静态链接，不跟着构建机的 glibc 版本走
          for tool in ffmpeg ffprobe; do
            file "release/linux-unpacked/resources/media-tools/linux-x64/$tool" | grep --quiet -E 'static(ally|-pie) linked'
          done
          # 在虚拟显示器上真起一次：页面服务最后才启动，它能答上来说明应用和采集器都起来了
          xvfb-run --auto-servernum release/linux-unpacked/DouyinDataReview --no-sandbox &
          curl --fail --silent --show-error --output /dev/null --retry 30 --retry-delay 1 --retry-connrefused http://127.0.0.1:47651/
          # 再等几秒建窗口和托盘；这期间崩了的话进程已经没了，kill 会报错
          sleep 5
          kill $!
      - name: Upload Windows installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: desktop-windows-x64
          path: |
            release/DouyinDataReview-Setup-*.exe
            release/DouyinDataReview-Setup-*.exe.blockmap
            release/latest.yml
          if-no-files-found: error
          retention-days: 14
      - name: Upload Apple Silicon installers
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: desktop-macos-arm64
          path: |
            release/DouyinDataReview-*-arm64.dmg
            release/DouyinDataReview-*-arm64.zip
            release/latest-mac.yml
          if-no-files-found: error
          retention-days: 14

      - name: Upload Linux installers
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: desktop-linux-x64
          path: |
            release/DouyinDataReview-*-x86_64.AppImage
            release/DouyinDataReview-*-amd64.deb
            release/latest-linux.yml
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish verified installers
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: desktop-*
          path: release-assets
          merge-multiple: true
      - name: Check update assets and generate SHA-256 checksums
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import fs from 'node:fs';
          import path from 'node:path';
          const { version } = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          assert.equal(process.env.GITHUB_REF_NAME, `v${version}`);
          const expected = [
            `DouyinDataReview-${version}-amd64.deb`,
            `DouyinDataReview-${version}-arm64.dmg`,
            `DouyinDataReview-${version}-arm64.zip`,
            `DouyinDataReview-${version}-x86_64.AppImage`,
            `DouyinDataReview-Setup-${version}.exe`,
            `DouyinDataReview-Setup-${version}.exe.blockmap`,
            'latest-linux.yml',
            'latest-mac.yml',
            'latest.yml',
          ].sort();
          assert.deepEqual(fs.readdirSync('release-assets').sort(), expected);
          const installers = expected.filter(name => /\.(?:dmg|zip|exe|AppImage|deb)$/u.test(name));
          const sums = installers.map(name => {
            const digest = createHash('sha256').update(fs.readFileSync(path.join('release-assets', name))).digest('hex');
            return `${digest}  ${name}`;
          });
          fs.writeFileSync('release-assets/SHA256SUMS', `${sums.join('\n')}\n`);
          NODE
      - name: Publish all installers together
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/* --verify-tag --draft --title "$GITHUB_REF_NAME" --notes-file .github/release-notes.md --generate-notes
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
