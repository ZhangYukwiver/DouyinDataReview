name: Bug report
description: 报告可以复现的问题
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        请先阅读 README 的常见问题和采集边界。不要上传 Cookie、Token、浏览器配置、聊天记录或未脱敏截图。
  - type: input
    id: version
    attributes:
      label: 应用版本
      placeholder: 例如 v0.1.9
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 系统与架构
      placeholder: 例如 Windows 11 x64 / macOS arm64
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: 请按顺序描述操作步骤。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期与实际结果
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 脱敏日志
      description: 请删除 Cookie、Token、账号标识、聊天内容和完整请求地址后再粘贴。
